openapi: 3.1.0
info:
  title: SGA — Sistema de Gestión de Alojamiento · Siete Raíces
  version: 2.0.0
  description: 'Contrato de la API REST de la Entrega 2. Es la fuente de verdad: la prueba ContratoOpenApiTest verifica que
    cada operación de este archivo exista en el código y viceversa. Autenticación: iniciar sesión en /auth/login y usar el
    botón Authorize con el token.


    Códigos: 400 forma del mensaje (Bean Validation), 401 sin token o token inválido, 403 rol insuficiente o recurso de otro
    huésped, 404 recurso inexistente, 409 regla del negocio violada.'
servers:
- url: http://localhost:8080/api
  description: Servidor local de desarrollo
security:
- bearerAuth: []
tags:
- name: Autenticación
  description: Registro, sesión y recuperación de contraseña (7.2)
- name: Usuarios
  description: Perfil y gestión de usuarios y roles (7.2)
- name: Alojamiento
  description: Datos, normas y servicios adicionales (7.3)
- name: Apartamentos
  description: Apartamentos (7.3), tarifas (7.4) y novedades (7.6)
- name: Bloqueos
  description: Bloqueos administrativos (7.3)
- name: Temporadas
  description: Temporadas del calendario (7.4)
- name: Política de cancelación
  description: Política versionada (7.4)
- name: Disponibilidad
  description: Disponibilidad y cotización (7.5)
- name: Reservas
  description: Ciclo de vida de las reservas (7.5, 7.6)
- name: Folios
  description: Cuenta de la reserva (7.7)
paths:
  /auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registro público de un huésped
      description: Crea un usuario con rol HUESPED y contraseña cifrada con BCrypt (7.2). El correo y el documento son únicos.
      operationId: registrarHuesped
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroHuespedRequest'
      responses:
        '201':
          description: Huésped registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: 'Valida las credenciales y emite un JWT firmado (HS256) con expiración. El token se envía en el encabezado
        Authorization: Bearer {token}.'
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioSesionRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/recuperacion:
    post:
      tags:
      - Autenticación
      summary: Solicitar código de recuperación
      description: Envía al correo registrado un código de 6 dígitos de un solo uso y 15 minutos de vigencia (7.2). Responde
        202 exista o no el correo, para no revelar qué cuentas existen. En local el correo se escribe en el log (I-02).
      operationId: solicitarRecuperacion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRecuperacionRequest'
      responses:
        '202':
          description: Solicitud recibida
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/recuperacion/restablecer:
    post:
      tags:
      - Autenticación
      summary: Restablecer la contraseña
      description: Con el código vigente y no usado; el código queda marcado como usado (7.2).
      operationId: restablecerContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '204':
          description: Contraseña restablecida
        '400':
          $ref: '#/components/responses/BadRequest'
  /usuarios/yo:
    get:
      tags:
      - Usuarios
      summary: Consultar mi perfil
      description: 'Datos del usuario autenticado, sin la contraseña.


        Roles: cualquier usuario autenticado.'
      operationId: consultarPerfil
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Usuarios
      summary: Actualizar mi perfil
      description: 'Nombre y teléfono; el correo no es editable (7.2).


        Roles: cualquier usuario autenticado.'
      operationId: actualizarPerfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /usuarios/yo/contrasena:
    put:
      tags:
      - Usuarios
      summary: Cambiar mi contraseña
      description: 'Con la contraseña actual y la nueva, que debe ser segura (7.2).


        Roles: cualquier usuario autenticado.'
      operationId: cambiarContrasena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contraseña cambiada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /usuarios:
    get:
      tags:
      - Usuarios
      summary: Listar usuarios activos
      description: 'Paginado de 10 en 10, por nombre.


        Roles: ADMINISTRADOR.'
      operationId: listarUsuarios
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Usuarios
      summary: Crear un usuario con rol
      description: 'Los roles internos solo los asigna un administrador (7.2).


        Roles: ADMINISTRADOR.'
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /usuarios/{identificacion}/rol:
    put:
      tags:
      - Usuarios
      summary: Asignar un rol
      description: 'Cambia el rol de un usuario (7.2).


        Roles: ADMINISTRADOR.'
      operationId: asignarRol
      parameters:
      - name: identificacion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /usuarios/{identificacion}:
    delete:
      tags:
      - Usuarios
      summary: Eliminar un usuario (lógico)
      description: 'El usuario queda inactivo. No se permite si es titular de reservas PENDIENTE, CONFIRMADA o EN_CURSO; sus
        reservas históricas se conservan (7.2).


        Roles: ADMINISTRADOR.'
      operationId: eliminarUsuario
      parameters:
      - name: identificacion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /alojamiento:
    get:
      tags:
      - Alojamiento
      summary: Consultar el alojamiento
      description: Datos, ubicación (mapa), horarios, normas y servicios adicionales (7.3).
      operationId: consultarAlojamiento
      security: []
      responses:
        '200':
          description: Alojamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Alojamiento
      summary: Actualizar el alojamiento
      description: 'Datos, normas y catálogo de servicios adicionales con su cargo (7.3, L-17). Los horarios y parámetros
        de la sección 6 son configuración externa.


        Roles: ADMINISTRADOR.'
      operationId: actualizarAlojamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarAlojamientoRequest'
      responses:
        '200':
          description: Alojamiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos:
    post:
      tags:
      - Apartamentos
      summary: Registrar un apartamento
      description: 'Registra un apartamento activo y PREPARADO. Exige tarifa en las tres temporadas (7.4) y una identificación
        única (L-04).


        Roles: ADMINISTRADOR.'
      operationId: registrarApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarApartamentoRequest'
      responses:
        '201':
          description: Apartamento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Apartamentos
      summary: Listar apartamentos
      description: 'Paginado de 10 en 10 y ordenado por identificación. Ignora los retirados salvo incluirRetirados=true (7.3);
        el personal de servicio filtra por estado operativo, p. ej. PENDIENTE_PREPARACION (7.1).


        Roles: ADMINISTRADOR, RECEPCIONISTA, PERSONAL_SERVICIO.'
      operationId: listarApartamentos
      parameters:
      - name: estadoOperativo
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EstadoOperativo'
      - name: incluirRetirados
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de apartamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /apartamentos/disponibles:
    get:
      tags:
      - Disponibilidad
      summary: Buscar apartamentos disponibles
      description: 'Aplica las validaciones de 7.5 en orden (entrada no anterior a hoy, activo con tarifas completas, capacidad,
        sin reservas ni bloqueos solapados, tiempo de preparación). Cada tarjeta trae el valor estimado de la estancia calculado
        con las fechas de nacimiento del grupo (sin ellas se estima con adultos). Filtros: capacidad, dormitorios, rango de
        precio sobre el valor estimado y características.'
      operationId: consultarApartamentosDisponibles
      security: []
      parameters:
      - name: fechaEntrada
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: fechaSalida
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: totalOcupantes
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
        description: Total del grupo, facturables o no
      - name: fechasNacimiento
        in: query
        required: false
        explode: true
        description: Una por ocupante, en el mismo número que totalOcupantes
        schema:
          type: array
          items:
            type: string
            format: date
          maxItems: 50
      - name: capacidadMinima
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: dormitoriosMinimos
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: precioMinimo
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: precioMaximo
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: caracteristicas
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          maxItems: 10
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de apartamentos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentosDisponibles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}:
    get:
      tags:
      - Apartamentos
      summary: Consultar un apartamento
      description: 'Detalle público: descripción, características y tarifas vigentes (7.1).'
      operationId: consultarApartamento
      security: []
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Apartamentos
      summary: Actualizar los datos de un apartamento
      description: 'Nombre, descripción, dormitorios y características (7.3).


        Roles: ADMINISTRADOR.'
      operationId: actualizarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarApartamentoRequest'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/calendario:
    get:
      tags:
      - Disponibilidad
      summary: Calendario de disponibilidad y ocupación
      description: 'Estado de cada noche en [desde, hasta): DISPONIBLE, RESERVADA, BLOQUEADA, EN_PREPARACION o NO_VENDIBLE
        (7.5). Solo el personal del alojamiento ve el código de la reserva. Máximo 366 noches.'
      operationId: consultarCalendario
      security: []
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Noches del calendario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NocheCalendarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /apartamentos/{identificacion}/tarifas/historial:
    get:
      tags:
      - Apartamentos
      summary: Histórico de tarifas
      description: 'Cada cambio de tarifa, del más reciente al más antiguo (7.4).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: historialTarifas
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroTarifaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /apartamentos/{identificacion}/novedades:
    post:
      tags:
      - Apartamentos
      summary: Registrar una novedad
      description: 'Con fecha, autor (tomado del token), descripción y gravedad (7.6).


        Roles: ADMINISTRADOR, RECEPCIONISTA, PERSONAL_SERVICIO.'
      operationId: registrarNovedadApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarNovedadApartamentoRequest'
      responses:
        '201':
          description: Novedad registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovedadApartamentoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - Apartamentos
      summary: Historial de novedades
      description: 'De la más reciente a la más antigua (7.6).


        Roles: ADMINISTRADOR, RECEPCIONISTA, PERSONAL_SERVICIO.'
      operationId: listarNovedadesApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Novedades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NovedadApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /apartamentos/{identificacion}/capacidad:
    put:
      tags:
      - Apartamentos
      summary: Cambiar la capacidad
      description: 'No afecta las reservas ya creadas aunque queden por encima de la nueva capacidad: se advierte y se listan
        (7.3).


        Roles: ADMINISTRADOR.'
      operationId: cambiarCapacidad
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarCapacidadRequest'
      responses:
        '200':
          description: Capacidad cambiada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioCapacidadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/tarifas:
    put:
      tags:
      - Apartamentos
      summary: Actualizar la tarifa de una temporada
      description: 'Reemplaza el valor por ocupante facturable y noche y lo agrega al histórico; no altera el valor congelado
        de las reservas (RN-22).


        Roles: ADMINISTRADOR.'
      operationId: actualizarTarifa
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/retirar:
    put:
      tags:
      - Apartamentos
      summary: Retirar de la venta (eliminación lógica)
      description: 'Solo si no tiene reservas activas ni futuras (7.3). El apartamento se conserva con activo = false.


        Roles: ADMINISTRADOR.'
      operationId: retirarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
