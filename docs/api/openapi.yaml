      summary: Registrar la llegada
      description: 'CONFIRMADA → EN_CURSO, no antes de la fecha de entrada (RN-10); el apartamento debe estar PREPARADO y
        pasa a OCUPADO (RN-11), en la misma transacción.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: registrarLlegada
