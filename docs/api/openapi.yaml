      description: 'PENDIENTE → CONFIRMADA. Exige el anticipo del 30 % en el folio (L-11), hora estimada de llegada (RN-09)
        y que no haya vencido el plazo de 24 horas (RN-21).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: confirmarReserva
