      - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservas/{codigo}/registrar-salida:
    put:
      tags:
      - Reservas
      summary: Registrar la salida
      description: 'EN_CURSO → FINALIZADA con el folio cerrado (RN-17); el apartamento queda PENDIENTE_PREPARACION.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: registrarSalida
      parameters:
      - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservas/{codigo}/no-show:
    put:
      tags:
      - Reservas
      summary: Declarar no-show
      description: 'Desde CONFIRMADA, a partir de las 20:00 del día de entrada y sin novedad pendiente (L-15). Aplica la retención
        de no-show de la política congelada (RN-13).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: declararNoShow
      parameters:
      - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folios/{codigoReserva}:
    get:
      tags:
      - Folios
      summary: Consultar el folio de una reserva
      description: 'Cargos, pagos y saldo derivado (saldo = cargos − pagos, RN-15).


        Roles: ADMINISTRADOR, RECEPCIONISTA, HUESPED (solo sobre sus reservas).'
      operationId: obtenerFolioPorReserva
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      responses:
        '200':
          description: Folio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /folios/{codigoReserva}/pagos:
    post:
      tags:
      - Folios
      summary: Registrar un pago o una devolución
      description: 'Valor positivo para abonos y negativo para devoluciones; no se devuelve más de lo pagado. Medios admitidos:
        L-18.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: registrarPagoFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoRequest'
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folios/{codigoReserva}/cargos:
    post:
      tags:
      - Folios
      summary: Registrar un cargo adicional
      description: 'Servicio adicional sobre un folio abierto (L-17). Los movimientos nunca se modifican ni se eliminan (RN-16).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: registrarCargoFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarCargoRequest'
      responses:
        '201':
          description: Cargo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folios/{codigoReserva}/servicios:
    post:
      tags:
      - Folios
      summary: Cargar un servicio adicional
      description: 'El valor sale del catálogo del alojamiento y de la cantidad (L-17); el servicio debe generar cargo.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: registrarServicioFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarServicioFolioRequest'
      responses:
        '201':
          description: Cargo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folios/{codigoReserva}/cerrar:
    put:
      tags:
      - Folios
      summary: Cerrar el folio
      description: 'Con saldo cero lo cierra la recepción. Con saldo distinto de cero solo un administrador, indicando el
        motivo: la autorización queda registrada con autor, motivo y momento (7.7, RN-17); un recepcionista recibe 403.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: cerrarFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarFolioRequest'
      responses:
        '200':
          description: Folio cerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CodigoReservaParam:
      name: codigo
      in: path
      required: true
      description: Código de la reserva
      schema:
        type: string
        pattern: ^RES-[0-9]{4}-[0-9]{5}$
        example: RES-2025-00001
    CodigoReservaFolioParam:
      name: codigoReserva
      in: path
      required: true
      description: Código de la reserva dueña del folio
      schema:
        type: string
        pattern: ^RES-[0-9]{4}-[0-9]{5}$
        example: RES-2025-00002
    IdentificacionApartamentoParam:
      name: identificacion
      in: path
      required: true
      schema:
        type: string
        pattern: ^APT-[0-9]{3}$
        example: APT-301
    PageParam:
      name: page
      in: query
      required: false
      description: Número de página (desde 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Elementos por página (máximo 10)
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
  schemas:
    EstadoReserva:
      type: string
      enum:
      - PENDIENTE
      - CONFIRMADA
      - EN_CURSO
      - FINALIZADA
      - CANCELADA
      - NO_SHOW
    CanalOrigen:
      type: string
      enum:
      - PORTAL
      - DIRECTO
      - EXTERNO
    TipoTemporada:
      type: string
      enum:
      - BASE
      - ALTA
      - ESPECIAL
    EstadoOperativo:
      type: string
      enum:
      - PREPARADO
      - OCUPADO
      - PENDIENTE_PREPARACION
      - EN_PREPARACION
      - FUERA_DE_SERVICIO
    MedioPago:
      type: string
      enum:
      - EFECTIVO
      - TARJETA_DEBITO
      - TARJETA_CREDITO
      - TRANSFERENCIA_BANCARIA
    TipoCargo:
      type: string
      enum:
      - ALOJAMIENTO
      - AJUSTE_ALOJAMIENTO
      - REVERSO_ALOJAMIENTO
      - SERVICIO_ADICIONAL
      - PENALIDAD
    Rol:
      type: string
      enum:
      - ADMINISTRADOR
      - RECEPCIONISTA
      - PERSONAL_SERVICIO
      - HUESPED
    RegistroHuespedRequest:
      type: object
      required:
      - correo
      - contrasena
      - nombreCompleto
      - telefono
      - documento
      - fechaNacimiento
      properties:
        correo:
          type: string
          maxLength: 120
          format: email
          example: nuevo@correo.com
        contrasena:
          type: string
          maxLength: 72
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,72}$
          example: Clave12345*
        nombreCompleto:
          type: string
          maxLength: 150
          example: Laura Ríos
        telefono:
          type: string
          maxLength: 30
          example: '3007654321'
        documento:
          type: string
          maxLength: 30
          example: '1094999888'
        fechaNacimiento:
          type: string
          format: date
          example: '1996-02-20'
    CrearUsuarioRequest:
      type: object
      required:
      - correo
      - contrasena
      - nombreCompleto
      - telefono
      - documento
      - fechaNacimiento
      - rol
      properties:
        correo:
          type: string
          maxLength: 120
          format: email
          example: servicio2@sieteraices.co
        contrasena:
          type: string
          maxLength: 72
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,72}$
          example: Servicio123*
        nombreCompleto:
          type: string
          maxLength: 150
          example: Marta Ruiz
        telefono:
          type: string
          maxLength: 30
          example: '3109876543'
        documento:
          type: string
          maxLength: 30
          example: '1000000009'
        fechaNacimiento:
          type: string
          format: date
          example: '1990-01-10'
        rol:
          $ref: '#/components/schemas/Rol'
    AsignarRolRequest:
      type: object
      required:
      - rol
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
    ActualizarPerfilRequest:
      type: object
      required:
      - nombreCompleto
      - telefono
      properties:
        nombreCompleto:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
    CambiarContrasenaRequest:
      type: object
      required:
      - contrasenaActual
      - contrasenaNueva
      properties:
        contrasenaActual:
          type: string
        contrasenaNueva:
          type: string
          maxLength: 72
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,72}$
    SolicitarRecuperacionRequest:
      type: object
      required:
      - correo
      properties:
        correo:
          type: string
          format: email
    RestablecerContrasenaRequest:
      type: object
      required:
      - correo
      - codigo
      - contrasenaNueva
      properties:
        correo:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
        contrasenaNueva:
          type: string
          maxLength: 72
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,72}$
    PaginaUsuarios:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    UnidadCobro:
      type: string
      enum:
      - POR_SOLICITUD
      - POR_PERSONA
      - POR_NOCHE
    ServicioAdicionalRequest:
      type: object
      required:
      - codigo
      - nombre
      - generaCargo
      - valor
      - unidad
      properties:
        codigo:
          type: string
          maxLength: 30
          pattern: ^[A-Z][A-Z0-9_]{1,29}$
          example: LAVANDERIA
        nombre:
          type: string
          maxLength: 80
        generaCargo:
          type: boolean
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          minimum: 0
        unidad:
          $ref: '#/components/schemas/UnidadCobro'
    ServicioAdicionalResponse:
      type: object
      required:
      - codigo
      - nombre
      - generaCargo
      - valor
      - unidad
      properties:
        codigo:
          type: string
        nombre:
          type: string
        generaCargo:
          type: boolean
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        unidad:
          $ref: '#/components/schemas/UnidadCobro'
    ActualizarAlojamientoRequest:
      type: object
      required:
      - nombre
      - descripcion
      - ciudad
      - direccion
      - latitud
      - longitud
      - normas
      - servicios
      properties:
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 1000
        ciudad:
          type: string
          maxLength: 80
        direccion:
          type: string
          maxLength: 150
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        normas:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 30
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ServicioAdicionalRequest'
          minItems: 1
          maxItems: 30
    AlojamientoResponse:
      type: object
      required:
      - nombre
      - descripcion
      - ciudad
      - direccion
      - latitud
      - longitud
      - horaEntrada
      - horaSalida
      - normas
      - servicios
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        ciudad:
          type: string
        direccion:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        horaEntrada:
          type: string
          format: time
          example: '15:30:00'
        horaSalida:
          type: string
          format: time
          example: '15:30:00'
        normas:
          type: array
          items:
            type: string
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ServicioAdicionalResponse'
    InicioSesionRequest:
      type: object
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
          format: email
          example: recepcion@sieteraices.co
        contrasena:
          type: string
          example: Recepcion123*
    TokenResponse:
      type: object
      required:
      - token
      - tipo
      - expiraEn
      - correo
      - rol
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: string
          format: date-time
        correo:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
    UsuarioResponse:
      type: object
      required:
      - identificacion
      - correo
      - nombreCompleto
      - telefono
      - documento
      - fechaNacimiento
      - rol
      - activo
      properties:
        identificacion:
          type: string
          format: uuid
        correo:
          type: string
        nombreCompleto:
          type: string
        telefono:
          type: string
        documento:
          type: string
        fechaNacimiento:
          type: string
          format: date
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
    TarifaRequest:
      type: object
      required:
      - temporada
      - valorPorOcupanteNoche
      properties:
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        valorPorOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          minimum: 0
          example: 78000
    TarifaResponse:
      type: object
      required:
      - temporada
      - valorPorOcupanteNoche
      properties:
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        valorPorOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
    RegistrarApartamentoRequest:
      type: object
      required:
      - identificacion
      - nombre
      - descripcion
      - dormitorios
      - capacidad
      - caracteristicas
      - tarifas
      properties:
        identificacion:
          type: string
          pattern: ^APT-[0-9]{3}$
          example: APT-401
        nombre:
          type: string
          maxLength: 80
          example: Mirador
        descripcion:
          type: string
          maxLength: 1000
          example: Vista a la cordillera
        dormitorios:
          type: integer
          minimum: 1
        capacidad:
          type: integer
          minimum: 1
        caracteristicas:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 20
          example:
          - Wifi
          - Balcón
        tarifas:
          type: array
          items:
            $ref: '#/components/schemas/TarifaRequest'
          minItems: 1
    ActualizarApartamentoRequest:
      type: object
      required:
      - nombre
      - descripcion
      - dormitorios
      - caracteristicas
      properties:
        nombre:
          type: string
          maxLength: 80
        descripcion:
          type: string
          maxLength: 1000
        dormitorios:
          type: integer
          minimum: 1
        caracteristicas:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 20
    RegistroTarifaResponse:
      type: object
      required:
      - temporada
      - valorPorOcupanteNoche
      - vigenteDesde
      properties:
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        valorPorOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        vigenteDesde:
          type: string
          format: date-time
    GravedadNovedad:
      type: string
      enum:
      - LEVE
      - MODERADA
      - GRAVE
    RegistrarNovedadApartamentoRequest:
      type: object
      required:
      - descripcion
      - gravedad
      properties:
        descripcion:
          type: string
          maxLength: 500
          example: Bombillo fundido en la cocina
        gravedad:
          $ref: '#/components/schemas/GravedadNovedad'
    NovedadApartamentoResponse:
      type: object
      required:
      - fecha
      - autor
      - descripcion
      - gravedad
      properties:
        fecha:
          type: string
          format: date-time
        autor:
          type: string
        descripcion:
          type: string
        gravedad:
          $ref: '#/components/schemas/GravedadNovedad'
    EstadoNoche:
      type: string
      enum:
      - DISPONIBLE
      - RESERVADA
      - BLOQUEADA
      - EN_PREPARACION
      - NO_VENDIBLE
    NocheCalendarioResponse:
      type: object
      required:
      - noche
      - estado
      properties:
        noche:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoNoche'
        reserva:
          type:
          - string
          - 'null'
    CambioCapacidadResponse:
      type: object
      required:
      - apartamento
      - reservasExcedidas
      properties:
        apartamento:
          $ref: '#/components/schemas/ApartamentoResponse'
        advertencia:
          type:
          - string
          - 'null'
        reservasExcedidas:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
    CambiarCapacidadRequest:
      type: object
      required:
      - capacidad
      properties:
        capacidad:
          type: integer
          minimum: 1
    ApartamentoResponse:
      type: object
      required:
      - identificacion
      - nombre
      - descripcion
      - dormitorios
      - capacidad
      - caracteristicas
      - estadoOperativo
      - activo
      - tarifas
      properties:
        identificacion:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        dormitorios:
          type: integer
        capacidad:
          type: integer
        caracteristicas:
          type: array
          items:
            type: string
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativo'
        activo:
          type: boolean
        tarifas:
          type: array
          items:
            $ref: '#/components/schemas/TarifaResponse'
    ApartamentoDisponibleResponse:
      type: object
      required:
      - identificacion
      - nombre
      - descripcion
      - dormitorios
      - capacidadMaxima
      - caracteristicas
      - noches
      - valorEstimado
      properties:
        identificacion:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        dormitorios:
          type: integer
        capacidadMaxima:
          type: integer
        caracteristicas:
          type: array
          items:
            type: string
        noches:
          type: integer
        valorEstimado:
          type: integer
          format: int64
          description: Valor total estimado de la estancia para el grupo
    PaginaApartamentos:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
