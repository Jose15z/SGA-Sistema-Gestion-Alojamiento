      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/TemporadaResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    TramoCancelacionRequest:
      type: object
      required:
      - antelacionMinimaHoras
      - porcentaje
      properties:
        antelacionMinimaHoras:
          type: integer
          format: int64
          minimum: 0
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
    TramoCancelacionResponse:
      type: object
      required:
      - antelacionMinimaHoras
      - porcentaje
      properties:
        antelacionMinimaHoras:
          type: integer
          format: int64
        porcentaje:
          type: number
    PublicarPoliticaRequest:
      type: object
      required:
      - tramos
      - porcentajeNoShow
      - horaEntrada
      properties:
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoCancelacionRequest'
          minItems: 1
        porcentajeNoShow:
          type: number
          minimum: 0
          maximum: 100
        horaEntrada:
          type: string
          format: time
          example: '15:30:00'
    PoliticaCancelacionResponse:
      type: object
      required:
      - version
      - tramos
      - porcentajeNoShow
      - horaEntrada
      properties:
        version:
          type: integer
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoCancelacionResponse'
        porcentajeNoShow:
          type: number
        horaEntrada:
          type: string
          format: time
          example: '15:30:00'
    OcupanteCotizacionRequest:
      type: object
      required:
      - fechaNacimiento
      properties:
        fechaNacimiento:
          type: string
          format: date
          example: '1995-04-12'
    CotizacionRequest:
      type: object
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - ocupantes
      properties:
        identificacionApartamento:
          type: string
          example: APT-301
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteCotizacionRequest'
          minItems: 1
    CargoNocheResponse:
      type: object
      required:
      - noche
      - temporada
      - tarifaOcupanteNoche
      - ocupantesFacturables
      - subtotalNoche
      properties:
        noche:
          type: string
          format: date
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        tarifaOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        ocupantesFacturables:
          type: integer
        subtotalNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
    CotizacionResponse:
      type: object
      required:
      - subtotal
      - porcentajeDescuento
      - valorDescuento
      - valorTotal
      - totalNoches
      - detalleNoches
      properties:
        subtotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        porcentajeDescuento:
          type: number
        valorDescuento:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        valorTotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        totalNoches:
          type: integer
        detalleNoches:
          type: array
          items:
            $ref: '#/components/schemas/CargoNocheResponse'
    OcupanteRequest:
      type: object
      required:
      - documento
      - nombreCompleto
      - fechaNacimiento
      properties:
        documento:
          type: string
          maxLength: 30
          example: '1094900123'
        nombreCompleto:
          type: string
          maxLength: 150
          example: Carlos Andrés Pérez
        fechaNacimiento:
          type: string
          format: date
          example: '1992-08-15'
    CrearReservaRequest:
      type: object
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - canalOrigen
      - titular
      properties:
        identificacionApartamento:
          type: string
          example: APT-102
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        identificadorExterno:
          type:
          - string
          - 'null'
          maxLength: 60
          description: Obligatorio si el canal es EXTERNO (RN-19)
        titular:
          $ref: '#/components/schemas/OcupanteRequest'
        acompanantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteRequest'
          description: Resto del grupo; puede estar vacío
        horaEstimadaLlegada:
          type:
          - string
          - 'null'
          format: time
        mascotas:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Máximo 1 por reserva (L-16)
    HoraLlegadaRequest:
      type: object
      required:
      - horaEstimadaLlegada
      properties:
        horaEstimadaLlegada:
          type: string
          format: time
          example: '15:30:00'
    NovedadLlegadaRequest:
      type: object
      required:
      - novedad
      properties:
        novedad:
          type: string
          maxLength: 300
    ModificarReservaRequest:
      type: object
      description: Un campo ausente conserva su valor. Para cambiar fechas se envían ambas.
      properties:
        identificacionApartamento:
          type:
          - string
          - 'null'
          pattern: ^APT-[0-9]{3}$
        fechaEntrada:
          type:
          - string
          - 'null'
          format: date
        fechaSalida:
          type:
          - string
          - 'null'
          format: date
        acompanantes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OcupanteRequest'
          maxItems: 30
          description: Nuevo grupo además del titular; ausente conserva el actual
    MovimientosDelDiaResponse:
      type: object
      required:
      - dia
      - llegadas
      - salidas
      properties:
        dia:
          type: string
          format: date
        llegadas:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
        salidas:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
    RegistrarVehiculoRequest:
      type: object
      required:
      - placa
      properties:
        placa:
          type: string
          pattern: ^[A-Za-z0-9 -]{5,9}$
          example: ABC123
    OcupanteResponse:
      type: object
      required:
      - documento
      - nombreCompleto
      - fechaNacimiento
      properties:
        documento:
          type: string
        nombreCompleto:
          type: string
        fechaNacimiento:
          type: string
          format: date
    EventoHistorialResponse:
      type: object
      required:
      - momento
      - accion
      - autor
      - estadoNuevo
      properties:
        momento:
          type: string
          format: date-time
        accion:
          type: string
          example: CREACION
        autor:
          type: string
        estadoAnterior:
          oneOf:
          - $ref: '#/components/schemas/EstadoReserva'
          - type: 'null'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoReserva'
        observacion:
          type:
          - string
          - 'null'
    ReservaResumenResponse:
      type: object
      required:
      - codigo
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - estado
      - canalOrigen
      - titularNombre
      - valorTotal
      - fechaCreacion
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        titularNombre:
          type: string
        valorTotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        fechaCreacion:
          type: string
          format: date-time
    PaginaReservas:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    ReservaDetalleResponse:
      type: object
      required:
      - codigo
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - canalOrigen
      - estado
      - fechaCreacion
      - mascotas
      - vehiculos
      - titular
      - ocupantes
      - cotizacionCongelada
      - versionPolitica
      - historial
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        identificadorExterno:
          type:
          - string
          - 'null'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        fechaCreacion:
          type: string
          format: date-time
        horaEstimadaLlegada:
          type:
          - string
          - 'null'
          format: time
        novedadLlegada:
          type:
          - string
          - 'null'
        mascotas:
          type: integer
        vehiculos:
          type: array
          items:
            type: string
        titular:
          $ref: '#/components/schemas/OcupanteResponse'
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteResponse'
        cotizacionCongelada:
          $ref: '#/components/schemas/CotizacionResponse'
        versionPolitica:
          type: integer
        historial:
          type: array
          items:
            $ref: '#/components/schemas/EventoHistorialResponse'
    CargoResponse:
      type: object
      required:
      - tipo
      - concepto
      - valor
      - momento
      - autor
      properties:
        tipo:
          $ref: '#/components/schemas/TipoCargo'
        concepto:
          type: string
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        momento:
          type: string
          format: date-time
        autor:
          type: string
    PagoResponse:
      type: object
      required:
      - identificacion
      - valor
      - medio
      - momento
      - concepto
      - autor
      properties:
        identificacion:
          type: string
          format: uuid
        valor:
          type: integer
          format: int64
          description: Positivo para abonos, negativo para devoluciones
        medio:
          $ref: '#/components/schemas/MedioPago'
        momento:
          type: string
          format: date-time
        concepto:
          type: string
        autor:
          type: string
    FolioResponse:
      type: object
      required:
      - codigoReserva
      - saldo
      - totalPagado
      - cerrado
      - cargos
      - pagos
      properties:
        codigoReserva:
          type: string
        saldo:
          type: integer
          format: int64
          description: 'Positivo: deuda del huésped; negativo: saldo a favor'
        totalPagado:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        cerrado:
          type: boolean
        autorizacionCierre:
          oneOf:
          - $ref: '#/components/schemas/AutorizacionCierreResponse'
          - type: 'null'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoResponse'
        pagos:
          type: array
          items:
            $ref: '#/components/schemas/PagoResponse'
    RegistrarPagoRequest:
      type: object
      required:
      - valor
      - medio
      - concepto
      properties:
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          example: 70200
        medio:
          $ref: '#/components/schemas/MedioPago'
        concepto:
          type: string
          maxLength: 300
    RegistrarCargoRequest:
      type: object
      required:
      - concepto
      - valor
      properties:
        concepto:
          type: string
          maxLength: 300
          example: Lavandería
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          minimum: 1
          example: 25000
    RegistrarServicioFolioRequest:
      type: object
      required:
      - codigoServicio
      - cantidad
      properties:
        codigoServicio:
          type: string
          example: DESAYUNO
        cantidad:
          type: integer
          minimum: 1
          maximum: 100
          example: 2
    AutorizacionCierreResponse:
      type: object
      required:
      - autor
      - motivo
      - momento
      properties:
        autor:
          type: string
        motivo:
          type: string
        momento:
          type: string
          format: date-time
    CerrarFolioRequest:
      type: object
      properties:
        motivo:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Motivo de la autorización; obligatorio si el saldo es distinto de cero (solo administrador, RN-17)
    ErrorResponse:
      type: object
      description: Formato único de error. Nunca incluye trazas técnicas.
      required:
      - estado
      - codigo
      - mensaje
      - detalles
      - marcaTiempo
      properties:
        estado:
          type: integer
          example: 409
        codigo:
          type: string
          description: NO_AUTENTICADO, ACCESO_DENEGADO, SOLICITUD_INVALIDA, RECURSO_NO_ENCONTRADO, REGLA_NEGOCIO_VIOLADA,
            CONFLICTO_USUARIO, CREDENCIALES_INVALIDAS, METODO_NO_PERMITIDO o ERROR_INTERNO
          example: REGLA_NEGOCIO_VIOLADA
        mensaje:
          type: string
          example: Existe una reserva activa en esas noches
        detalles:
          type: array
          items:
            type: string
        marcaTiempo:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: La solicitud no cumple el formato esperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Sin token, token inválido o expirado, o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El rol no lo permite o el recurso pertenece a otro huésped
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Regla del negocio violada o correo/documento ya registrados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
