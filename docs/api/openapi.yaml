openapi: 3.1.0
info:
  title: SGA — Sistema de Gestión de Alojamiento · Siete Raíces
  version: 2.0.0
  description: 'Contrato de la API REST de la Entrega 2. Es la fuente de verdad: la prueba ContratoOpenApiTest verifica que
    cada operación de este archivo exista en el código y viceversa. Autenticación: iniciar sesión en /auth/login y usar el
    botón Authorize con el token.


    Códigos: 400 forma del mensaje (Bean Validation), 401 sin token o token inválido, 403 rol insuficiente o recurso de otro
    huésped, 404 recurso inexistente, 409 regla del negocio violada.'
servers:
- url: http://localhost:8080/api
  description: Servidor local de desarrollo
security:
- bearerAuth: []
tags:
- name: Autenticación
  description: Usuarios y seguridad (7.2)
- name: Apartamentos
  description: Alojamiento y apartamentos (7.3) y tarifas (7.4)
- name: Bloqueos
  description: Bloqueos administrativos (7.3)
- name: Temporadas
  description: Temporadas del calendario (7.4)
- name: Política de cancelación
  description: Política versionada (7.4)
- name: Disponibilidad
  description: Disponibilidad y cotización (7.5)
- name: Reservas
  description: Ciclo de vida de las reservas (7.5, 7.6)
- name: Folios
  description: Cuenta de la reserva (7.7)
paths:
  /auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registro público de un huésped
      description: Crea un usuario con rol HUESPED y contraseña cifrada con BCrypt (7.2). El correo y el documento son únicos.
      operationId: registrarHuesped
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroHuespedRequest'
      responses:
        '201':
          description: Huésped registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: 'Valida las credenciales y emite un JWT firmado (HS256) con expiración. El token se envía en el encabezado
        Authorization: Bearer {token}.'
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioSesionRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /apartamentos:
    post:
      tags:
      - Apartamentos
      summary: Registrar un apartamento
      description: 'Registra un apartamento activo y PREPARADO. Exige tarifa en las tres temporadas (7.4) y una identificación
        única (L-04).


        Roles: ADMINISTRADOR.'
      operationId: registrarApartamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarApartamentoRequest'
      responses:
        '201':
          description: Apartamento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Apartamentos
      summary: Listar apartamentos
      description: 'Inventario completo (activos y retirados), paginado de 10 en 10 y ordenado por identificación.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: listarApartamentos
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de apartamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /apartamentos/disponibles:
    get:
      tags:
      - Disponibilidad
      summary: Buscar apartamentos disponibles
      description: Apartamentos activos que admiten al grupo (RN-02), sin reservas activas solapadas (RN-01), sin bloqueos
        vigentes (RN-07) y respetando el tiempo de preparación (RN-20). Filtro opcional por dormitorios.
      operationId: consultarApartamentosDisponibles
      security: []
      parameters:
      - name: fechaEntrada
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: fechaSalida
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: totalOcupantes
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
        description: Total del grupo, facturables o no
      - name: dormitoriosMinimos
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de apartamentos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaApartamentosDisponibles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}:
    get:
      tags:
      - Apartamentos
      summary: Consultar un apartamento
      description: 'Detalle del apartamento con sus tarifas.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: consultarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /apartamentos/{identificacion}/capacidad:
    put:
      tags:
      - Apartamentos
      summary: Cambiar la capacidad
      description: 'No afecta las reservas ya creadas (7.3).


        Roles: ADMINISTRADOR.'
      operationId: cambiarCapacidad
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarCapacidadRequest'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/tarifas:
    put:
      tags:
      - Apartamentos
      summary: Actualizar la tarifa de una temporada
      description: 'Reemplaza el valor por ocupante facturable y noche; no altera el valor congelado de las reservas (RN-22).


        Roles: ADMINISTRADOR.'
      operationId: actualizarTarifa
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/retirar:
    put:
      tags:
      - Apartamentos
      summary: Retirar de la venta (eliminación lógica)
      description: 'Solo si no tiene reservas activas ni futuras (7.3). El apartamento se conserva con activo = false.


        Roles: ADMINISTRADOR.'
      operationId: retirarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/reactivar:
    put:
      tags:
      - Apartamentos
      summary: Devolver a la venta
      description: 'Exige tarifas completas (7.4).


        Roles: ADMINISTRADOR.'
      operationId: reactivarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/iniciar-preparacion:
    put:
      tags:
      - Apartamentos
      summary: Iniciar preparación
      description: 'PENDIENTE_PREPARACION → EN_PREPARACION.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: iniciarPreparacion
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/marcar-preparado:
    put:
      tags:
      - Apartamentos
      summary: Marcar preparado
      description: 'EN_PREPARACION → PREPARADO (RN-11).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: marcarPreparado
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/fuera-de-servicio:
    put:
      tags:
      - Apartamentos
      summary: Declarar fuera de servicio
      description: 'No se permite desde OCUPADO.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: declararFueraDeServicio
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/reincorporar:
    put:
      tags:
      - Apartamentos
      summary: Reincorporar a preparación
      description: 'FUERA_DE_SERVICIO → PENDIENTE_PREPARACION.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: reincorporarApartamento
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartamentoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /apartamentos/{identificacion}/bloqueos:
    post:
      tags:
      - Bloqueos
      summary: Registrar un bloqueo
      description: 'Impide vender el apartamento en [fechaEntrada, fechaSalida) (RN-07). No se permite sobre noches con reservas
        activas ni sobre un bloqueo vigente (7.3).


        Roles: ADMINISTRADOR.'
      operationId: registrarBloqueo
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarBloqueoRequest'
      responses:
        '201':
          description: Bloqueo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Bloqueos
      summary: Listar los bloqueos de un apartamento
      description: 'Vigentes y levantados, paginados.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: listarBloqueos
      parameters:
      - $ref: '#/components/parameters/IdentificacionApartamentoParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de bloqueos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBloqueos'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bloqueos/{identificacion}/levantar:
    put:
      tags:
      - Bloqueos
      summary: Levantar un bloqueo
      description: 'Eliminación lógica: el bloqueo se conserva con su motivo de levantamiento.


        Roles: ADMINISTRADOR.'
      operationId: levantarBloqueo
      parameters:
      - name: identificacion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoRequest'
      responses:
        '200':
          description: Bloqueo levantado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /temporadas:
    post:
      tags:
      - Temporadas
      summary: Registrar una temporada
      description: 'Temporada ALTA o ESPECIAL con fechas (ambas noches incluidas). No puede solaparse con otra (L-08); la
        BASE cubre lo no asignado y no se registra por fechas (7.4).


        Roles: ADMINISTRADOR.'
      operationId: registrarTemporada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTemporadaRequest'
      responses:
        '201':
          description: Temporada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Temporadas
      summary: Listar temporadas
      description: 'Ordenadas por fecha de inicio, paginadas.


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: listarTemporadas
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de temporadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTemporadas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /politicas-cancelacion:
    post:
      tags:
      - Política de cancelación
      summary: Publicar una nueva versión de la política
      description: 'La versión anterior se conserva: las reservas existentes siguen usando la suya (RN-13, RN-22). Los tramos
        deben cubrir desde 0 horas sin repetir umbrales (L-10).


        Roles: ADMINISTRADOR.'
      operationId: publicarPoliticaCancelacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarPoliticaRequest'
      responses:
        '201':
          description: Política publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /politicas-cancelacion/vigente:
    get:
      tags:
      - Política de cancelación
      summary: Consultar la política vigente
      description: Tramos por antelación respecto de la hora de entrada y porcentaje de no-show.
      operationId: consultarPoliticaVigente
      security: []
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
  /cotizaciones:
    post:
      tags:
      - Disponibilidad
      summary: Cotizar una estancia
      description: Valor noche por noche según la temporada de cada noche y los ocupantes facturables (RN-05, RN-06), con
        el descuento por estancia prolongada (RP-03) y la estancia mínima en Temporada Especial (RP-01). No guarda nada.
      operationId: cotizarEstancia
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionRequest'
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva
      description: 'Crea la reserva en PENDIENTE con su valor y política congelados (RN-22) y abre el folio con el cargo de
        alojamiento (7.7). El grupo es el titular más sus acompañantes. Un huésped solo reserva por el PORTAL y a su nombre;
        el personal registra reservas DIRECTO o EXTERNO.


        Roles: ADMINISTRADOR, RECEPCIONISTA, HUESPED (solo sobre sus reservas).'
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - Reservas
      summary: Listar reservas
      description: 'Filtros opcionales, de la más reciente a la más antigua, 10 por página. Un huésped solo obtiene las suyas.


        Roles: ADMINISTRADOR, RECEPCIONISTA, HUESPED (solo sobre sus reservas).'
      operationId: listarReservas
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EstadoReserva'
      - name: apartamento
        in: query
        required: false
        schema:
          type: string
          pattern: ^APT-[0-9]{3}$
      - name: entradaDesde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: entradaHasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservas/{codigo}:
    get:
      tags:
      - Reservas
      summary: Consultar una reserva
      description: 'Detalle con grupo, valor congelado, política e historial.


        Roles: ADMINISTRADOR, RECEPCIONISTA, HUESPED (solo sobre sus reservas).'
      operationId: obtenerReservaPorCodigo
      parameters:
      - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
