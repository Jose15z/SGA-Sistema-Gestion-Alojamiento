        '409':
          $ref: '#/components/responses/Conflict'
  /folios/{codigoReserva}/cerrar:
    put:
      tags:
      - Folios
      summary: Cerrar el folio
      description: 'Con saldo distinto de cero exige una autorización registrada (RN-17).


        Roles: ADMINISTRADOR, RECEPCIONISTA.'
      operationId: cerrarFolio
      parameters:
      - $ref: '#/components/parameters/CodigoReservaFolioParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarFolioRequest'
      responses:
        '200':
          description: Folio cerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CodigoReservaParam:
      name: codigo
      in: path
      required: true
      description: Código de la reserva
      schema:
        type: string
        pattern: ^RES-[0-9]{4}-[0-9]{5}$
        example: RES-2025-00001
    CodigoReservaFolioParam:
      name: codigoReserva
      in: path
      required: true
      description: Código de la reserva dueña del folio
      schema:
        type: string
        pattern: ^RES-[0-9]{4}-[0-9]{5}$
        example: RES-2025-00002
    IdentificacionApartamentoParam:
      name: identificacion
      in: path
      required: true
      schema:
        type: string
        pattern: ^APT-[0-9]{3}$
        example: APT-301
    PageParam:
      name: page
      in: query
      required: false
      description: Número de página (desde 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Elementos por página (máximo 10)
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
  schemas:
    EstadoReserva:
      type: string
      enum:
      - PENDIENTE
      - CONFIRMADA
      - EN_CURSO
      - FINALIZADA
      - CANCELADA
      - NO_SHOW
    CanalOrigen:
      type: string
      enum:
      - PORTAL
      - DIRECTO
      - EXTERNO
    TipoTemporada:
      type: string
      enum:
      - BASE
      - ALTA
      - ESPECIAL
    EstadoOperativo:
      type: string
      enum:
      - PREPARADO
      - OCUPADO
      - PENDIENTE_PREPARACION
      - EN_PREPARACION
      - FUERA_DE_SERVICIO
    MedioPago:
      type: string
      enum:
      - EFECTIVO
      - TARJETA_DEBITO
      - TARJETA_CREDITO
      - TRANSFERENCIA_BANCARIA
    TipoCargo:
      type: string
      enum:
      - ALOJAMIENTO
      - AJUSTE_ALOJAMIENTO
      - REVERSO_ALOJAMIENTO
      - SERVICIO_ADICIONAL
      - PENALIDAD
    Rol:
      type: string
      enum:
      - ADMINISTRADOR
      - RECEPCIONISTA
      - HUESPED
    RegistroHuespedRequest:
      type: object
      required:
      - correo
      - contrasena
      - nombreCompleto
      - documento
      properties:
        correo:
          type: string
          maxLength: 120
          format: email
          example: nuevo@correo.com
        contrasena:
          type: string
          maxLength: 72
          minLength: 8
          example: Clave12345*
        nombreCompleto:
          type: string
          maxLength: 150
          example: Laura Ríos
        documento:
          type: string
          maxLength: 30
          example: '1094999888'
    InicioSesionRequest:
      type: object
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
          format: email
          example: recepcion@sieteraices.co
        contrasena:
          type: string
          example: Recepcion123*
    TokenResponse:
      type: object
      required:
      - token
      - tipo
      - expiraEn
      - correo
      - rol
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: string
          format: date-time
        correo:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
    UsuarioResponse:
      type: object
      required:
      - correo
      - nombreCompleto
      - documento
      - rol
      properties:
        correo:
          type: string
        nombreCompleto:
          type: string
        documento:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
    TarifaRequest:
      type: object
      required:
      - temporada
      - valorPorOcupanteNoche
      properties:
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        valorPorOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          minimum: 0
          example: 78000
    TarifaResponse:
      type: object
      required:
      - temporada
      - valorPorOcupanteNoche
      properties:
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        valorPorOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
    RegistrarApartamentoRequest:
      type: object
      required:
      - identificacion
      - nombre
      - dormitorios
      - capacidad
      - tarifas
      properties:
        identificacion:
          type: string
          pattern: ^APT-[0-9]{3}$
          example: APT-401
        nombre:
          type: string
          maxLength: 80
          example: Mirador
        dormitorios:
          type: integer
          minimum: 1
        capacidad:
          type: integer
          minimum: 1
        tarifas:
          type: array
          items:
            $ref: '#/components/schemas/TarifaRequest'
          minItems: 1
    CambiarCapacidadRequest:
      type: object
      required:
      - capacidad
      properties:
        capacidad:
          type: integer
          minimum: 1
    ApartamentoResponse:
      type: object
      required:
      - identificacion
      - nombre
      - dormitorios
      - capacidad
      - estadoOperativo
      - activo
      - tarifas
      properties:
        identificacion:
          type: string
        nombre:
          type: string
        dormitorios:
          type: integer
        capacidad:
          type: integer
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativo'
        activo:
          type: boolean
        tarifas:
          type: array
          items:
            $ref: '#/components/schemas/TarifaResponse'
    ApartamentoDisponibleResponse:
      type: object
      required:
      - identificacion
      - nombre
      - dormitorios
      - capacidadMaxima
      properties:
        identificacion:
          type: string
        nombre:
          type: string
        dormitorios:
          type: integer
        capacidadMaxima:
          type: integer
    PaginaApartamentos:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ApartamentoResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    PaginaApartamentosDisponibles:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ApartamentoDisponibleResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    RegistrarBloqueoRequest:
      type: object
      required:
      - fechaEntrada
      - fechaSalida
      - motivo
      properties:
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        motivo:
          type: string
          maxLength: 300
    MotivoRequest:
      type: object
      required:
      - motivo
      properties:
        motivo:
          type: string
          maxLength: 300
          example: Cambio de planes del huésped
    BloqueoResponse:
      type: object
      required:
      - identificacion
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - motivo
      - vigente
      properties:
        identificacion:
          type: string
          format: uuid
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        motivo:
          type: string
        vigente:
          type: boolean
        motivoLevantamiento:
          type:
          - string
          - 'null'
    PaginaBloqueos:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/BloqueoResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    RegistrarTemporadaRequest:
      type: object
      required:
      - nombre
      - tipo
      - fechaInicio
      - fechaFin
      properties:
        nombre:
          type: string
          maxLength: 80
          example: Semana Santa 2028
        tipo:
          $ref: '#/components/schemas/TipoTemporada'
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
    TemporadaResponse:
      type: object
      required:
      - nombre
      - tipo
      - fechaInicio
      - fechaFin
      properties:
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoTemporada'
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
    PaginaTemporadas:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/TemporadaResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    TramoCancelacionRequest:
      type: object
      required:
      - antelacionMinimaHoras
      - porcentaje
      properties:
        antelacionMinimaHoras:
          type: integer
          format: int64
          minimum: 0
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
    TramoCancelacionResponse:
      type: object
      required:
      - antelacionMinimaHoras
      - porcentaje
      properties:
        antelacionMinimaHoras:
          type: integer
          format: int64
        porcentaje:
          type: number
    PublicarPoliticaRequest:
      type: object
      required:
      - tramos
      - porcentajeNoShow
      - horaEntrada
      properties:
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoCancelacionRequest'
          minItems: 1
        porcentajeNoShow:
          type: number
          minimum: 0
          maximum: 100
        horaEntrada:
          type: string
          format: time
          example: '15:30:00'
    PoliticaCancelacionResponse:
      type: object
      required:
      - version
      - tramos
      - porcentajeNoShow
      - horaEntrada
      properties:
        version:
          type: integer
        tramos:
          type: array
          items:
            $ref: '#/components/schemas/TramoCancelacionResponse'
        porcentajeNoShow:
          type: number
        horaEntrada:
          type: string
          format: time
          example: '15:30:00'
    OcupanteCotizacionRequest:
      type: object
      required:
      - fechaNacimiento
      properties:
        fechaNacimiento:
          type: string
          format: date
          example: '1995-04-12'
    CotizacionRequest:
      type: object
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - ocupantes
      properties:
        identificacionApartamento:
          type: string
          example: APT-301
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteCotizacionRequest'
          minItems: 1
    CargoNocheResponse:
      type: object
      required:
      - noche
      - temporada
      - tarifaOcupanteNoche
      - ocupantesFacturables
      - subtotalNoche
      properties:
        noche:
          type: string
          format: date
        temporada:
          $ref: '#/components/schemas/TipoTemporada'
        tarifaOcupanteNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        ocupantesFacturables:
          type: integer
        subtotalNoche:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
    CotizacionResponse:
      type: object
      required:
      - subtotal
      - porcentajeDescuento
      - valorDescuento
      - valorTotal
      - totalNoches
      - detalleNoches
      properties:
        subtotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        porcentajeDescuento:
          type: number
        valorDescuento:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        valorTotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        totalNoches:
          type: integer
        detalleNoches:
          type: array
          items:
            $ref: '#/components/schemas/CargoNocheResponse'
    OcupanteRequest:
      type: object
      required:
      - documento
      - nombreCompleto
      - fechaNacimiento
      properties:
        documento:
          type: string
          maxLength: 30
          example: '1094900123'
        nombreCompleto:
          type: string
          maxLength: 150
          example: Carlos Andrés Pérez
        fechaNacimiento:
          type: string
          format: date
          example: '1992-08-15'
    CrearReservaRequest:
      type: object
      required:
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - canalOrigen
      - titular
      properties:
        identificacionApartamento:
          type: string
          example: APT-102
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        identificadorExterno:
          type:
          - string
          - 'null'
          maxLength: 60
          description: Obligatorio si el canal es EXTERNO (RN-19)
        titular:
          $ref: '#/components/schemas/OcupanteRequest'
        acompanantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteRequest'
          description: Resto del grupo; puede estar vacío
        horaEstimadaLlegada:
          type:
          - string
          - 'null'
          format: time
        mascotas:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Máximo 1 por reserva (L-16)
    HoraLlegadaRequest:
      type: object
      required:
      - horaEstimadaLlegada
      properties:
        horaEstimadaLlegada:
          type: string
          format: time
          example: '15:30:00'
    NovedadLlegadaRequest:
      type: object
      required:
      - novedad
      properties:
        novedad:
          type: string
          maxLength: 300
    ModificarEstanciaRequest:
      type: object
      required:
      - fechaEntrada
      - fechaSalida
      properties:
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
    RegistrarVehiculoRequest:
      type: object
      required:
      - placa
      properties:
        placa:
          type: string
          pattern: ^[A-Za-z0-9 -]{5,9}$
          example: ABC123
    OcupanteResponse:
      type: object
      required:
      - documento
      - nombreCompleto
      - fechaNacimiento
      properties:
        documento:
          type: string
        nombreCompleto:
          type: string
        fechaNacimiento:
          type: string
          format: date
    EventoHistorialResponse:
      type: object
      required:
      - momento
      - accion
      - autor
      - estadoNuevo
      properties:
        momento:
          type: string
          format: date-time
        accion:
          type: string
          example: CREACION
        autor:
          type: string
        estadoAnterior:
          oneOf:
          - $ref: '#/components/schemas/EstadoReserva'
          - type: 'null'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoReserva'
        observacion:
          type:
          - string
          - 'null'
    ReservaResumenResponse:
      type: object
      required:
      - codigo
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - estado
      - canalOrigen
      - titularNombre
      - valorTotal
      - fechaCreacion
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        titularNombre:
          type: string
        valorTotal:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        fechaCreacion:
          type: string
          format: date-time
    PaginaReservas:
      type: object
      required:
      - contenido
      - pagina
      - tamanio
      - totalElementos
      - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ReservaResumenResponse'
        pagina:
          type: integer
        tamanio:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    ReservaDetalleResponse:
      type: object
      required:
      - codigo
      - identificacionApartamento
      - fechaEntrada
      - fechaSalida
      - canalOrigen
      - estado
      - fechaCreacion
      - mascotas
      - vehiculos
      - titular
      - ocupantes
      - cotizacionCongelada
      - versionPolitica
      - historial
      properties:
        codigo:
          type: string
          example: RES-2026-00001
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        identificadorExterno:
          type:
          - string
          - 'null'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        fechaCreacion:
          type: string
          format: date-time
        horaEstimadaLlegada:
          type:
          - string
          - 'null'
          format: time
        novedadLlegada:
          type:
          - string
          - 'null'
        mascotas:
          type: integer
        vehiculos:
          type: array
          items:
            type: string
        titular:
          $ref: '#/components/schemas/OcupanteResponse'
        ocupantes:
          type: array
          items:
            $ref: '#/components/schemas/OcupanteResponse'
        cotizacionCongelada:
          $ref: '#/components/schemas/CotizacionResponse'
        versionPolitica:
          type: integer
        historial:
          type: array
          items:
            $ref: '#/components/schemas/EventoHistorialResponse'
    CargoResponse:
      type: object
      required:
      - tipo
      - concepto
      - valor
      - momento
      - autor
      properties:
        tipo:
          $ref: '#/components/schemas/TipoCargo'
        concepto:
          type: string
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        momento:
          type: string
          format: date-time
        autor:
          type: string
    PagoResponse:
      type: object
      required:
      - identificacion
      - valor
      - medio
      - momento
      - concepto
      - autor
      properties:
        identificacion:
          type: string
          format: uuid
        valor:
          type: integer
          format: int64
          description: Positivo para abonos, negativo para devoluciones
        medio:
          $ref: '#/components/schemas/MedioPago'
        momento:
          type: string
          format: date-time
        concepto:
          type: string
        autor:
          type: string
    FolioResponse:
      type: object
      required:
      - codigoReserva
      - saldo
      - totalPagado
      - cerrado
      - cargos
      - pagos
      properties:
        codigoReserva:
          type: string
        saldo:
          type: integer
          format: int64
          description: 'Positivo: deuda del huésped; negativo: saldo a favor'
        totalPagado:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
        cerrado:
          type: boolean
        autorizacionCierre:
          type:
          - string
          - 'null'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoResponse'
        pagos:
          type: array
          items:
            $ref: '#/components/schemas/PagoResponse'
    RegistrarPagoRequest:
      type: object
      required:
      - valor
      - medio
      - concepto
      properties:
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          example: 70200
        medio:
          $ref: '#/components/schemas/MedioPago'
        concepto:
          type: string
          maxLength: 300
    RegistrarCargoRequest:
      type: object
      required:
      - concepto
      - valor
      properties:
        concepto:
          type: string
          maxLength: 300
          example: Lavandería
        valor:
          type: integer
          format: int64
          description: Pesos colombianos sin decimales
          minimum: 1
          example: 25000
    CerrarFolioRequest:
      type: object
      properties:
        autorizacion:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Obligatoria si el saldo es distinto de cero (RN-17)
    ErrorResponse:
      type: object
      description: Formato único de error. Nunca incluye trazas técnicas.
      required:
      - estado
      - codigo
      - mensaje
      - detalles
      - marcaTiempo
      properties:
        estado:
          type: integer
          example: 409
        codigo:
          type: string
          description: NO_AUTENTICADO, ACCESO_DENEGADO, SOLICITUD_INVALIDA, RECURSO_NO_ENCONTRADO, REGLA_NEGOCIO_VIOLADA,
            CREDENCIALES_INVALIDAS, METODO_NO_PERMITIDO o ERROR_INTERNO
          example: REGLA_NEGOCIO_VIOLADA
        mensaje:
          type: string
          example: Existe una reserva activa en esas noches
        detalles:
          type: array
          items:
            type: string
        marcaTiempo:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: La solicitud no cumple el formato esperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Sin token, token inválido o expirado, o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El rol no lo permite o el recurso pertenece a otro huésped
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Regla del negocio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
