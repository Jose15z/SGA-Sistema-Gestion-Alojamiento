spring.application.name=sga
server.port=8080

# --- H2 (Guía 03 y 10) ---
# La zona de H2 coincide con la del alojamiento: CURRENT_DATE y LOCALTIMESTAMP de data.sql
# usan la misma hora que el reloj de la aplicación
spring.datasource.url=jdbc:h2:mem:sgadb;DB_CLOSE_DELAY=-1;TIME ZONE=${sga.alojamiento.zona-horaria}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# data.sql se ejecuta después de que Hibernate crea las tablas (Guía 10)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Parámetros de la Ficha del Alojamiento Siete Raíces (Anexo A, sección 6) ---
# Se cambian aquí (o con variables de entorno) sin recompilar.
sga.alojamiento.zona-horaria=America/Bogota
sga.alojamiento.umbral-edad-facturable=10
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=3
sga.alojamiento.plazo-confirmacion-horas=24
# L-15: valor único del no-show en configuración, validaciones y pruebas (20:00)
sga.alojamiento.hora-limite-no-show=20:00
sga.alojamiento.porcentaje-anticipo=30
# RP-03: descuento por estancia prolongada
sga.alojamiento.noches-minimas-descuento=7
sga.alojamiento.porcentaje-descuento-estancia-prolongada=10
# RP-01: mínimo de noches cuando la estancia incluye Temporada Especial
sga.alojamiento.noches-minimas-por-temporada.ESPECIAL=2
# L-16: mascotas por reserva
sga.alojamiento.mascotas-maximas-por-reserva=1
# RP-02: vehículos por reserva, cupos y cargo del vehículo adicional
sga.alojamiento.vehiculos-maximos-por-reserva=2
sga.alojamiento.vehiculos-incluidos-por-reserva=1
sga.alojamiento.cupos-parqueadero=9
sga.alojamiento.tarifa-vehiculo-adicional-noche=20000

# --- Vencimiento de reservas PENDIENTE (RN-21) ---
# segundo minuto hora día mes día-de-la-semana: cada 15 minutos
sga.vencimiento.cron=0 */15 * * * *

# --- Paginación: 10 elementos por página en todos los listados ---
sga.paginacion.tamanio-maximo=10

# --- Seguridad JWT (Guía 12) ---
# La clave NUNCA se versiona: se entrega con la variable de entorno SGA_JWT_SECRETO
# (mínimo 32 caracteres). Si no existe, se genera una clave aleatoria al arrancar.
sga.seguridad.jwt.secreto=${SGA_JWT_SECRETO:}
sga.seguridad.jwt.expiracion-minutos=60
sga.seguridad.jwt.emisor=sga-siete-raices

# --- Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Contrato SGA (docs/api/openapi.yaml)
springdoc.swagger-ui.urls[0].url=/openapi.yaml
springdoc.swagger-ui.urls[1].name=Generado desde el codigo
springdoc.swagger-ui.urls[1].url=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true
