spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SGA_DB_JDBC_URL}
spring.datasource.username=${SGA_DB_USER}
spring.datasource.password=${SGA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.data-locations=classpath:data-postgresql.sql
# El catálogo completo es un solo bloque PostgreSQL DO.
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
